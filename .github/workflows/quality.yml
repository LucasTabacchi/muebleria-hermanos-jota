name: Quality checks

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - develop

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: ESLint and tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.22.1
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            # The contract suite targets a manually started server and Atlas.
            # CI instead runs the self-contained API suite backed by MongoMemoryServer.
            - name: Run backend API tests
              run: npm run test:api --workspace=backend

            - name: Run React client tests
              run: npm run test:client

            - name: Build React client
              run: npm run build
